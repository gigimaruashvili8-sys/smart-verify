[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["api/_fonts/**"]
  node_bundler = "esbuild"

# SPA fallback (API path is served by the function config below, which takes priority)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
